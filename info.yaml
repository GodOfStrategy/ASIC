
# Tiny Tapeout project information
project:
  title: "Tiny8 - 8-Bit Processor"
  author: "Shaurya Baitule"
  discord: ""
  description: "A custom 8-bit processor with a 16-bit instruction set, registers, arithmetic and memory operations."
  language: "Verilog"
  clock_hz: 12000000

  # Initial area target. We will validate this during hardening.
  tiles: "1x2"

  top_module: "tt_um_godofstrategy_tiny8"

  source_files:
    - "project.v"
    - "tiny8_top.v"
    - "sram_bb.v"

pinout:
  # Inputs
  ui[0]: "CPU input bit 0"
  ui[1]: "CPU input bit 1"
  ui[2]: "CPU input bit 2"
  ui[3]: "CPU input bit 3"
  ui[4]: "CPU input bit 4"
  ui[5]: "CPU input bit 5"
  ui[6]: "CPU input bit 6"
  ui[7]: "CPU input bit 7"

  # Outputs
  uo[0]: "CPU output bit 0"
  uo[1]: "CPU output bit 1"
  uo[2]: "CPU output bit 2"
  uo[3]: "CPU output bit 3"
  uo[4]: "CPU output bit 4"
  uo[5]: "CPU output bit 5"
  uo[6]: "CPU output bit 6"
  uo[7]: "CPU output bit 7"

  # Bidirectional pins used as program-counter outputs
  uio[0]: "Program counter bit 0"
  uio[1]: "Program counter bit 1"
  uio[2]: "Program counter bit 2"
  uio[3]: "Program counter bit 3"
  uio[4]: "Program counter bit 4"
  uio[5]: "Program counter bit 5"
  uio[6]: "Program counter bit 6"
  uio[7]: "Program counter bit 7"

yaml_version: 6
